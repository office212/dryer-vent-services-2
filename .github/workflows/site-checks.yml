name: Site checks

# Read-only checks for the static site: internal links and images in every
# HTML page, HTML parsing, and JavaScript syntax. No deploys, no secrets,
# and no change to the site itself. External links are intentionally not
# fetched, so the job stays deterministic and offline-safe.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check internal links, images and HTML parsing
        shell: python
        run: |
          import os
          import sys
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlparse

          ROOT = os.getcwd()
          errors = []
          SKIP = ("http://", "https://", "mailto:", "tel:", "#", "data:", "javascript:")

          class Checker(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for attr in ("href", "src"):
                      if attr in values:
                          self.links.append((attr, values[attr], self.getpos()[0]))

          def page_path(target):
              path = unquote(target).lstrip("/")
              if not path:
                  path = "index.html"
              candidate = os.path.join(ROOT, path)
              if os.path.isdir(candidate):
                  candidate = os.path.join(candidate, "index.html")
              return candidate

          html_files = []
          for dirpath, dirnames, filenames in os.walk(ROOT):
              dirnames[:] = [d for d in dirnames if d != ".git"]
              for name in filenames:
                  if name.endswith(".html"):
                      html_files.append(os.path.join(dirpath, name))

          for path in sorted(html_files):
              rel = os.path.relpath(path, ROOT)
              parser = Checker(rel)
              try:
                  with open(path, encoding="utf-8") as handle:
                      parser.feed(handle.read())
              except Exception as exc:
                  errors.append(f"{rel}: cannot read or parse: {exc}")
                  continue
              for attr, value, line in parser.links:
                  if not value or value.startswith(SKIP):
                      continue
                  target = urlparse(value).path
                  if not target:
                      continue
                  if target.startswith("/"):
                      resolved = page_path(target)
                  else:
                      resolved = os.path.normpath(os.path.join(os.path.dirname(path), target))
                  if os.path.isfile(resolved):
                      continue
                  # Browsers fall back to the root favicon when a page uses a
                  # relative favicon.ico link, so that case is not a failure
                  # as long as the root favicon exists.
                  if os.path.basename(target) == "favicon.ico" and os.path.isfile(os.path.join(ROOT, "favicon.ico")):
                      continue
                  errors.append(f"{rel}:{line}: broken {attr} -> {value}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: {len(html_files)} HTML files, no broken internal links or images.")
