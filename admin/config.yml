      - {file: "articles/air/index.html", label: "Airflow", name: "air", fields: [{label: "SEO Title", name: "title", widget: "string", selector: "title"}, {label: "H1", name: "h1", widget: "string", selector: "h1"}]}
      - {file: "articles/birds/index.html", label: "Birds & Nests", name: "birds", fields: [{label: "SEO Title", name: "title", widget: "string", selector: "title"}, {label: "H1", name: "h1", widget: "string", selector: "h1"}]}
