backend:
  name: github
  repo: office212/dryer-vent-services-2
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  # =========================================
  # 1. דף הבית (Home)
  # =========================================
  - name: "home_page"
    label: "🏠 דף הבית (Home)"
    files:
      - file: "index.html"
        label: "דף הבית"
        name: "index"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
          - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}
          - {label: "Hero Title", name: "hero_title", widget: "string", selector: ".hero-title"}
          - {label: "Hero Subtitle", name: "hero_sub", widget: "text", selector: ".hero-sub"}

  # =========================================
  # 2. דפים סטטיים (About, FAQ, Contact, Reviews, Gallery)
  # =========================================
  - name: "static_pages"
    label: "📄 דפים כלליים (Static Pages)"
    files:
      - file: "about/index.html"
        label: "אודות (About)"
        name: "about"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
          - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}
          - {label: "כותרת ראשית (H1)", name: "h1", widget: "string", selector: "h1"}

      - file: "faq/index.html"
        label: "שאלות נפוצות (FAQ)"
        name: "faq"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
          - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}
          - {label: "כותרת ראשית (H1)", name: "h1", widget: "string", selector: "h1"}

      - file: "contact/index.html"
        label: "צור קשר (Contact)"
        name: "contact"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
          - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}
          - {label: "כותרת ראשית (H1)", name: "h1", widget: "string", selector: "h1"}

      - file: "reviews/index.html"
        label: "ביקורות (Reviews)"
        name: "reviews"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
          - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}

      - file: "gallery/index.html"
        label: "גלריה (Gallery)"
        name: "gallery"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
          - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}

  # =========================================
  # 3. כל המאמרים (28 דפי Articles + הוספת חדשים)
  # =========================================
  - name: "articles"
    label: "📝 מאמרים (Articles - 28 דפים)"
    folder: "articles"
    create: true
    path: "{{slug}}/index"
    extension: "html"
    format: "html"
    fields:
      - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
      - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}
      - {label: "כותרת המאמר (H1)", name: "h1", widget: "string", selector: "h1"}
      - {label: "תוכן המאמר", name: "body", widget: "markdown", selector: ".section, main, article"}

  # =========================================
  # 4. כל אזורי השירות (10 דפי Service Areas + הוספת חדשים)
  # =========================================
  - name: "areas"
    label: "📍 אזורי שירות (Areas - 10 דפים)"
    folder: "areas"
    create: true
    path: "{{slug}}/index"
    extension: "html"
    format: "html"
    fields:
      - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
      - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}
      - {label: "כותרת האזור (H1)", name: "h1", widget: "string", selector: "h1"}
      - {label: "תוכן העמוד", name: "body", widget: "markdown", selector: ".section, main"}

  # =========================================
  # 5. דפי שירותים (Services + הוספת חדשים)
  # =========================================
  - name: "services"
    label: "🛠️ שירותים (Services)"
    folder: "services"
    create: true
    path: "{{slug}}/index"
    extension: "html"
    format: "html"
    fields:
      - {label: "SEO Title", name: "title", widget: "string", selector: "title"}
      - {label: "SEO Description", name: "description", widget: "text", selector: 'meta[name="description"]', attr: "content"}
      - {label: "כותרת השירות (H1)", name: "h1", widget: "string", selector: "h1"}
      - {label: "תוכן העמוד", name: "body", widget: "markdown", selector: ".section, main"}
