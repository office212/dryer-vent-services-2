backend:
  name: github
  repo: office212/dryer-vent-services-2
  branch: main
  base_url: https://sveltia-cms.netlify.app
  auth_endpoint: /.netlify/functions/auth

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  # =========================================
  # 1. הגדרות כלליות (Settings)
  # =========================================
  - name: "settings"
    label: "⚙️ הגדרות אתר (Settings)"
    files:
      - file: "admin/data/settings.json"
        label: "פרטי קשר ו-SEO"
        name: "general"
        fields:
          - {label: "מספר טלפון ראשי", name: "phone", widget: "string"}
          - {label: "תיאור האתר (Meta Description לגוגל)", name: "seo_desc", widget: "text"}
          - {label: "קישור לוואטסאפ", name: "whatsapp_link", widget: "string"}

  # =========================================
  # 2. דפים מרכזיים (Pages)
  # =========================================
  - name: "pages"
    label: "📄 דפים מרכזיים (Pages)"
    files:
      - file: "admin/data/home.json"
        label: "דף הבית (Home)"
        name: "home"
        fields:
          - {label: "כותרת ראשית (Hero Title)", name: "hero_title", widget: "string"}
          - {label: "טקסט משנה (Hero Subtitle)", name: "hero_sub", widget: "text"}
          - {label: "תמונת רקע", name: "hero_bg", widget: "image", required: false}

  # =========================================
  # 3. ניהול שירותים (Services)
  # =========================================
  - name: "services"
    label: "🛠️ שירותים (Services)"
    folder: "admin/data/services"
    create: true
    slug: "{{slug}}"
    extension: "json"
    fields:
      - {label: "שם השירות (למשל: Cleaning)", name: "title", widget: "string"}
      - {label: "תיאור קצר (לכרטיסייה בדף הבית)", name: "short_desc", widget: "text"}
      - {label: "תוכן הדף המלא", name: "body", widget: "markdown"}
      - {label: "תמונת השירות", name: "image", widget: "image"}

  # =========================================
  # 4. מאמרים ופוסטים (Articles/Blog)
  # =========================================
  - name: "articles"
    label: "📝 מאמרים (Articles)"
    folder: "admin/data/articles"
    create: true
    slug: "{{slug}}"
    extension: "json"
    fields:
      - {label: "כותרת המאמר", name: "title", widget: "string"}
      - {label: "תיאור קצר", name: "description", widget: "text"}
      - {label: "תמונה ראשית", name: "image", widget: "image", required: false}
      - {label: "תאריך פרסום", name: "date", widget: "datetime"}
      - {label: "תוכן המאמר", name: "body", widget: "markdown"}
